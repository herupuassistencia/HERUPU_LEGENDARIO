# HERUPU LEGENDÁRIO — exemplo de site nginx.
# Troque SEU-DOMINIO.com pelo seu domínio e salve em /etc/nginx/sites-available/herupu
# Depois:
#   sudo ln -s /etc/nginx/sites-available/herupu /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d SEU-DOMINIO.com      (ativa o HTTPS, obrigatório para o microfone)

server {
    listen 80;
    server_name SEU-DOMINIO.com;

    location / {
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
